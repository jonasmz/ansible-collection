---
# Koha, MariaDB and Apache come preinstalled in the image
# (extensions/molecule/image/build.sh); this only prepares the running container.
- name: Prepare the container
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for systemd
      ansible.builtin.command: systemctl is-system-running --wait
      register: systemd_ready
      changed_when: false
      failed_when: systemd_ready.stdout not in ['running', 'degraded']

    - name: The image provides koha-create
      ansible.builtin.stat:
        path: /usr/sbin/koha-create
      register: koha_create
      failed_when: not koha_create.stat.exists
      # Build the image first: extensions/molecule/image/build.sh

    - name: MariaDB and Apache are running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      loop: [mariadb, apache2]
